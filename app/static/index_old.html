<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>README Generator Pro + 项目理解助手</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 2rem;
            background: #f6f8fa;
        }
        .container {
            max-width: 1600px;
            margin: auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea, input, select, button {
            margin: 0.5rem 0;
            padding: 8px;
            font-size: 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            background: #2c974b;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #2c6e3f; }
        .row {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .col {
            flex: 1;
            min-width: 250px;
        }
        .form-group { margin-bottom: 1rem; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        small { color: #666; font-size: 0.8rem; }
        hr { margin: 1.5rem 0; }
        pre {
            background: #f1f1f1;
            padding: 1rem;
            overflow: auto;
            border-radius: 8px;
            font-size: 0.9rem;
        }
        #fileTree {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }
        .tree-node { margin-left: 20px; }
        .tree-dir { font-weight: bold; cursor: pointer; color: #0366d6; }
        .tree-file { cursor: pointer; color: #24292e; }
        .tree-file:hover, .tree-dir:hover { text-decoration: underline; }
        .chat-area {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            background: #fefefe;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            padding-right: 5px;
        }
        .chat-input-area {
            display: flex;
            gap: 8px;
        }
        .chat-input-area input { flex: 1; }
        .message { margin-bottom: 12px; }
        .user-msg { text-align: right; color: #0366d6; }
        .assistant-msg { text-align: left; color: #2c3e50; background: #f1f1f1; padding: 6px; border-radius: 8px; }
        .file-viewer {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
        }
        .annotation { color: #6a737d; font-style: italic; margin-bottom: 10px; }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #2c974b;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-note {
            background: #e7f3ff;
            border-left: 4px solid #0366d6;
            padding: 8px 12px;
            margin: 10px 0;
            font-size: 0.9rem;
            border-radius: 4px;
        }
        .progress-stage {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #2c974b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📄 README Generator Pro + 项目理解助手</h1>

    <form id="genForm" enctype="multipart/form-data">
        <div class="form-group">
            <label>GitHub 仓库链接（可选）</label>
            <input type="text" name="repo_url" style="width: 100%;" placeholder="https://github.com/user/repo">
        </div>
        <div class="form-group">
            <label>或上传本地项目</label>
            <select id="uploadType">
                <option value="folder">📁 上传文件夹（推荐，自动过滤无用文件）</option>
                <option value="zip">🗜️ 上传 ZIP（完整上传，后端解压后过滤）</option>
            </select>
            <div id="folderUploadDiv"><input type="file" id="folderInput" webkitdirectory directory multiple></div>
            <div id="zipUploadDiv" style="display:none;"><input type="file" id="zipInput" accept=".zip"></div>
            <div class="info-note" id="filterNote">
                💡 使用“上传文件夹”模式会自动跳过模型权重文件（.bin, .pth, .safetensors等）、大文件（>5MB）、缓存目录（__pycache__、node_modules等）的文件内容，只保留文件名空壳，节省上传时间。
            </div>
        </div>
        <div class="form-group">
            <label>额外要求</label>
            <textarea name="user_requirements" rows="2" placeholder="例如：强调性能"></textarea>
        </div>
        <div class="form-group">
            <label>目标平台</label>
            <select name="platform_target"><option>github</option><option>gitee</option></select>
        </div>
        <div class="form-group">
            <label>模型（可选）</label>
            <select name="model_name" id="modelNameSelect">
                <option value="">默认</option>
                <option value="gpt-3.5-turbo">GPT-3.5</option>
                <option value="deepseek-chat">DeepSeek</option>
                <option value="custom">自定义</option>
            </select>
            <input type="text" id="customModelName" placeholder="模型名" style="display:none;">
        </div>
        <div class="form-group">
            <label>API Base URL</label>
            <input type="text" name="api_base" id="apiBaseInput" placeholder="https://api.deepseek.com/v1">
        </div>
        <button type="submit">✨ 生成 README</button>
    </form>

    <!-- 统一进度弹窗（上传 + 生成） -->
    <div id="progressOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:2rem; border-radius:12px; min-width:300px; text-align:center;">
            <h3 id="progressTitle">正在处理...</h3>
            <div style="width:100%; background:#e0e0e0; border-radius:10px; margin:15px 0;">
                <div id="progressBarFill" style="width:0%; height:20px; background:#2c974b; border-radius:10px; transition:width 0.3s;"></div>
            </div>
            <p id="progressMessage">准备中...</p>
            <div id="indeterminateProgress" style="display:none;">
                <div class="spinner"></div>
            </div>
            <div id="uploadStats" style="font-size:0.8rem; color:#555; margin-top:8px;"></div>
        </div>
    </div>

    <hr>

    <div class="row">
        <div class="col" style="flex: 1.2;">
            <h2>📁 项目结构 (点击文件查看详情)</h2>
            <div id="fileTree">等待生成...</div>
        </div>
        <div class="col" style="flex: 1.5;">
            <h2>📄 文件内容 & 功能注释</h2>
            <div id="fileViewer" class="file-viewer">
                <div class="annotation" id="fileAnnotation"></div>
                <pre id="fileContent">点击左侧文件查看内容</pre>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <h2>📝 生成的 README</h2>
            <textarea id="readmeContent" rows="20" readonly style="width:100%; font-family:monospace;"></textarea>
            <button id="modifyBtn" style="margin-top:8px;">🔄 修改 README</button>
            <input type="text" id="modifyInput" placeholder="修改指令..." style="width:70%; margin-top:8px;">
        </div>
        <div class="col">
            <h2>💬 项目问答助手</h2>
            <div class="chat-area">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="例如：这个项目如何启动？核心模块是哪个？">
                    <button id="sendChatBtn">发送</button>
                </div>
            </div>
            <button id="genUnderstandingBtn" style="margin-top:10px; background:#6f42c1;">📘 生成 UNDERSTANDING.md</button>
        </div>
    </div>
</div>

<script>
    // ==================== 前端过滤规则（与后端保持一致） ====================
    const IGNORE_DIRS = new Set([
        '__pycache__', '.git', '.venv', 'venv', 'env', 'node_modules',
        '.cache', '.idea', '.vscode', 'dist', 'build', 'target',
        '.pytest_cache', '.mypy_cache', '.ruff_cache',
        'transformers', 'models', 'pretrained_models', 'bert', 'qwen',
        'llama', 'gpt', 't5', 'vit', 'resnet', 'checkpoints', 'weights'
    ]);

    const IGNORE_FILE_EXTS = new Set([
        '.bin', '.pth', '.pt', '.safetensors', '.h5', '.pb', '.onnx',
        '.ckpt', '.pkl', '.joblib', '.npy', '.npz', '.model', '.weights',
        '.pickle', '.parquet', '.arrow', '.msgpack'
    ]);

    const TEXT_EXTS = new Set([
        '.py', '.js', '.ts', '.json', '.md', '.txt', '.yml', '.yaml', '.toml',
        '.ini', '.cfg', '.html', '.css', '.scss', '.sql', '.sh', '.java', '.c', '.cpp'
    ]);

    const MAX_FILE_SIZE_MB = 1;  // 前端只上传小于1MB的文本文件内容，更大的只记录路径

    function shouldIgnoreFile(fileName, fileSize, relativePath) {
        // 检查路径中是否包含忽略目录
        const pathParts = relativePath.split('/');
        for (let part of pathParts.slice(0, -1)) {
            if (IGNORE_DIRS.has(part)) return true;
        }
        // 检查扩展名
        const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
        if (IGNORE_FILE_EXTS.has(ext)) return true;
        // 检查大小（超过阈值不读取内容，但仍然上传路径占位）
        if (fileSize > MAX_FILE_SIZE_MB * 1024 * 1024) return true;
        return false;
    }

    // ==================== 全局变量 ====================
    let currentSession = null;
    let currentSessionConfig = { model_name: '', api_base: '' };
    let fileTreeJson = null;

    // ---------- 辅助函数：控制进度弹窗 ----------
    function showProgress(title, mode = 'determinate') {
        const overlay = document.getElementById('progressOverlay');
        const progressBar = document.getElementById('progressBarFill');
        const msgDiv = document.getElementById('progressMessage');
        const titleDiv = document.getElementById('progressTitle');
        const indeterminateDiv = document.getElementById('indeterminateProgress');
        const uploadStats = document.getElementById('uploadStats');

        overlay.style.display = 'flex';
        titleDiv.innerText = title;
        msgDiv.innerText = '准备中...';
        uploadStats.innerText = '';

        if (mode === 'indeterminate') {
            indeterminateDiv.style.display = 'block';
            progressBar.style.display = 'none';
        } else {
            indeterminateDiv.style.display = 'none';
            progressBar.style.display = 'block';
            progressBar.style.width = '0%';
        }
    }

    function updateProgress(percent, message, stats = '') {
        const progressBar = document.getElementById('progressBarFill');
        const msgDiv = document.getElementById('progressMessage');
        const uploadStats = document.getElementById('uploadStats');
        if (progressBar && progressBar.style.display !== 'none') {
            progressBar.style.width = percent + '%';
        }
        msgDiv.innerText = message;
        if (stats) uploadStats.innerText = stats;
    }

    function hideProgress() {
        const overlay = document.getElementById('progressOverlay');
        overlay.style.display = 'none';
        // 重置状态
        document.getElementById('progressBarFill').style.width = '0%';
        document.getElementById('progressMessage').innerText = '';
        document.getElementById('uploadStats').innerText = '';
    }

    // ---------- 监听后台生成任务进度（SSE） ----------
    async function watchGenerationTask(taskId) {
        return new Promise((resolve, reject) => {
            const eventSource = new EventSource(`/api/task/${taskId}/stream`);
            eventSource.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.progress !== undefined) {
                    updateProgress(data.progress, data.message);
                }
                if (data.status === 'completed') {
                    eventSource.close();
                    hideProgress();
                    resolve(data.result);
                } else if (data.status === 'failed') {
                    eventSource.close();
                    hideProgress();
                    reject(new Error(data.error || data.message));
                }
            };
            eventSource.onerror = () => {
                eventSource.close();
                hideProgress();
                reject(new Error('连接后台任务进度失败'));
            };
        });
    }

    // ---------- 使用 XHR 上传文件并显示进度 ----------
    function uploadFormDataWithProgress(formData, onProgress) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/api/generate-task', true);
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    onProgress(percent, e.loaded, e.total);
                }
            });
            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        const response = JSON.parse(xhr.responseText);
                        resolve(response);
                    } catch (err) {
                        reject(new Error('解析响应失败: ' + err.message));
                    }
                } else {
                    reject(new Error(`上传失败 (${xhr.status}): ${xhr.statusText}`));
                }
            };
            xhr.onerror = () => reject(new Error('网络错误，上传中断'));
            xhr.send(formData);
        });
    }

    // ---------- 表单提交：上传 + 生成（带上传进度条） ----------
    const form = document.getElementById('genForm');
    form.onsubmit = async (e) => {
        e.preventDefault();

        const repoUrl = document.querySelector('input[name="repo_url"]').value.trim();
        const userReqs = document.querySelector('textarea[name="user_requirements"]').value;
        const platform = document.querySelector('select[name="platform_target"]').value;
        let modelName = document.getElementById('modelNameSelect').value;
        if (modelName === 'custom') modelName = document.getElementById('customModelName').value.trim();
        else if (modelName === '') modelName = null;
        const apiBase = document.getElementById('apiBaseInput').value.trim() || null;

        // 构建 FormData
        const formData = new FormData();

        if (repoUrl) {
            formData.append('repo_url', repoUrl);
        } else {
            const uploadType = document.getElementById('uploadType').value;
            if (uploadType === 'folder') {
                const files = document.getElementById('folderInput').files;
                if (!files.length) { alert('请选择文件夹或输入GitHub链接'); return; }
                // 过滤文件（大小/扩展名/忽略目录）
                const ignoredFiles = [];
                let keptCount = 0;
                for (let f of files) {
                    const relPath = f.webkitRelativePath;
                    if (shouldIgnoreFile(f.name, f.size, relPath)) {
                        ignoredFiles.push(relPath);
                    } else {
                        formData.append('folder_files', f, f.webkitRelativePath);
                        keptCount++;
                    }
                }
                formData.append('ignored_files', JSON.stringify(ignoredFiles));
                // 如果没有有效文件，但 ignoredFiles 不为空，可能用户选的全是忽略文件
                if (keptCount === 0 && ignoredFiles.length > 0) {
                    alert('所选文件夹中的所有文件都被过滤规则忽略（模型权重/大文件/缓存目录等），请选择包含源代码的文件夹');
                    return;
                }
            } else { // zip
                const zipFile = document.getElementById('zipInput').files[0];
                if (!zipFile) { alert('请选择ZIP文件'); return; }
                formData.append('folder_zip', zipFile);
            }
        }

        formData.append('user_requirements', userReqs);
        formData.append('platform_target', platform);
        if (modelName) formData.append('model_name', modelName);
        if (apiBase) formData.append('api_base', apiBase);

        // 显示上传进度条（确定模式）
        showProgress('⏫ 正在上传项目文件', 'determinate');

        let taskId = null;
        try {
            // 执行上传（带进度回调）
            const uploadResponse = await uploadFormDataWithProgress(formData, (percent, loaded, total) => {
                const mbLoaded = (loaded / 1024 / 1024).toFixed(1);
                const mbTotal = (total / 1024 / 1024).toFixed(1);
                updateProgress(percent, `上传中 ${percent}%`, `${mbLoaded} MB / ${mbTotal} MB`);
            });
            taskId = uploadResponse.task_id;
            if (!taskId) throw new Error('服务器未返回任务ID');

            // 上传完成，切换到生成进度阶段
            showProgress('🤖 正在生成 README', 'determinate');
            updateProgress(0, '后台分析中，请稍候...');

            // 监听后台任务进度
            const result = await watchGenerationTask(taskId);
            // 保存会话信息
            currentSession = result.session_id;
            currentSessionConfig = { model_name: modelName, api_base: apiBase };
            document.getElementById('readmeContent').value = result.readme_content;
            if (result.file_tree_json) {
                fileTreeJson = result.file_tree_json;
                renderFileTree(fileTreeJson);
            } else if (result.file_tree_preview) {
                document.getElementById('fileTree').innerText = result.file_tree_preview;
            }
        } catch (err) {
            hideProgress();
            alert('操作失败: ' + err.message);
        }
    };

    // ========== 渲染文件树 (递归) ==========
    function renderFileTree(node, container = null) {
        const root = container || document.getElementById('fileTree');
        if (!container) root.innerHTML = '';
        const ul = document.createElement('ul');
        ul.style.listStyle = 'none';
        ul.style.paddingLeft = '0';
        function build(n, parentUl) {
            for (let [name, info] of Object.entries(n)) {
                const li = document.createElement('li');
                if (info.type === 'dir') {
                    const span = document.createElement('span');
                    span.textContent = '📁 ' + name;
                    span.className = 'tree-dir';
                    span.onclick = () => {
                        let childUl = li.querySelector('ul');
                        if (childUl) childUl.style.display = childUl.style.display === 'none' ? 'block' : 'none';
                        else {
                            childUl = document.createElement('ul');
                            childUl.style.paddingLeft = '20px';
                            build(info.children, childUl);
                            li.appendChild(childUl);
                        }
                    };
                    li.appendChild(span);
                } else {
                    const span = document.createElement('span');
                    span.textContent = '📄 ' + name;
                    span.className = 'tree-file';
                    span.onclick = () => loadFileContent(info.path);
                    li.appendChild(span);
                }
                parentUl.appendChild(li);
            }
        }
        build(node, ul);
        if (!container) root.appendChild(ul);
        else container.appendChild(ul);
    }

    async function loadFileContent(filePath) {
        if (!currentSession) return;
        const resp = await fetch(`/api/file_content?session_id=${currentSession}&file_path=${encodeURIComponent(filePath)}`);
        const data = await resp.json();
        document.getElementById('fileAnnotation').innerHTML = data.annotation ? `📌 功能注释：${data.annotation}` : '';
        document.getElementById('fileContent').innerText = data.content || '无内容';
    }

    // 聊天相关
    function addMessage(text, role) {
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.className = `message ${role}-msg`;
        div.innerHTML = role === 'user' ? `<strong>你:</strong> ${text}` : `<strong>助手:</strong> ${text}`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendChatWithLoading(sessionId, question) {
        showProgress('💬 AI 思考中', 'indeterminate');
        try {
            const resp = await fetch(`/api/chat?session_id=${sessionId}&question=${encodeURIComponent(question)}`, { method: 'POST' });
            const data = await resp.json();
            hideProgress();
            return data.answer;
        } catch (err) {
            hideProgress();
            throw err;
        }
    }

    async function genUnderstandingWithLoading(sessionId) {
        showProgress('📘 生成项目理解文档', 'indeterminate');
        try {
            const resp = await fetch(`/api/understanding?session_id=${sessionId}`, { method: 'POST' });
            const data = await resp.json();
            hideProgress();
            return data.content;
        } catch (err) {
            hideProgress();
            throw err;
        }
    }

    // 修改 README（也使用进度条，复用后台任务流程）
    async function modifyWithProgress(sessionId, modification, platform, modelName, apiBase) {
        const submitResp = await fetch('/api/modify-task', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                session_id: sessionId,
                modification: modification,
                platform_target: platform,
                model_name: modelName,
                api_base: apiBase
            })
        });
        const { task_id } = await submitResp.json();
        showProgress('🔄 正在修改 README', 'determinate');
        updateProgress(0, '提交修改指令成功，等待生成...');
        const result = await watchGenerationTask(task_id);
        return result;
    }

    // ---------- UI 事件绑定 ----------
    // 上传方式切换
    const uploadType = document.getElementById('uploadType');
    const folderDiv = document.getElementById('folderUploadDiv');
    const zipDiv = document.getElementById('zipUploadDiv');
    const filterNote = document.getElementById('filterNote');
    uploadType.onchange = () => {
        if (uploadType.value === 'folder') {
            folderDiv.style.display = 'block';
            zipDiv.style.display = 'none';
            filterNote.style.display = 'block';
        } else {
            folderDiv.style.display = 'none';
            zipDiv.style.display = 'block';
            filterNote.style.display = 'none';
        }
    };
    // 自定义模型
    const modelSelect = document.getElementById('modelNameSelect');
    const customModel = document.getElementById('customModelName');
    modelSelect.onchange = () => {
        customModel.style.display = modelSelect.value === 'custom' ? 'inline-block' : 'none';
    };
    // 修改按钮
    document.getElementById('modifyBtn').onclick = async () => {
        if (!currentSession) { alert('请先生成 README'); return; }
        const modification = document.getElementById('modifyInput').value;
        if (!modification) return;
        const platform = document.querySelector('select[name="platform_target"]').value;
        const modelName = currentSessionConfig.model_name;
        const apiBase = currentSessionConfig.api_base;
        try {
            const result = await modifyWithProgress(currentSession, modification, platform, modelName, apiBase);
            document.getElementById('readmeContent').value = result.readme_content;
        } catch (err) {
            alert('修改失败：' + err.message);
        }
    };
    // 聊天发送
    const sendBtn = document.getElementById('sendChatBtn');
    const chatInput = document.getElementById('chatInput');
    async function sendMessage() {
        const q = chatInput.value.trim();
        if (!q || !currentSession) return;
        addMessage(q, 'user');
        chatInput.value = '';
        try {
            const answer = await sendChatWithLoading(currentSession, q);
            addMessage(answer, 'assistant');
        } catch (err) {
            addMessage('出错：' + err.message, 'assistant');
        }
    }
    sendBtn.onclick = sendMessage;
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    // 生成 UNDERSTANDING.md
    document.getElementById('genUnderstandingBtn').onclick = async () => {
        if (!currentSession) { alert('请先生成 README'); return; }
        try {
            const content = await genUnderstandingWithLoading(currentSession);
            const blob = new Blob([content], {type: 'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'UNDERSTANDING.md';
            a.click();
            URL.revokeObjectURL(url);
        } catch (err) {
            alert('生成失败：' + err.message);
        }
    };
</script>
</body>
</html>
