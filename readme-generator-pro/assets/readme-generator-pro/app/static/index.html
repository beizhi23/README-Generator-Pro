<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>README Generator Pro</title>
<style>
        :root {
            --accent: #0891B2;
            --accent-hover: #0E7490;
            --accent-subtle: #ECFEFF;
            --success: #059669;
            --success-subtle: #ECFDF5;
            --warning: #D97706;
            --warning-subtle: #FFFBEB;
            --danger: #DC2626;
            --danger-subtle: #FEF2F2;
            --info: #2563EB;
            --info-subtle: #EFF6FF;
            --bg: #FFFFFF;
            --bg-dim: #F8FAFC;
            --bg-panel: #F1F5F9;
            --text: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border: #E2E8F0;
            --border-focus: #0891B2;
            --shadow: 0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius: 6px;
        }
        [data-theme="dark"] {
            --accent: #22D3EE;
            --accent-hover: #67E8F9;
            --accent-subtle: #083344;
            --success: #34D399;
            --success-subtle: #064E3B;
            --warning: #FBBF24;
            --warning-subtle: #78350F;
            --danger: #F87171;
            --danger-subtle: #7F1D1D;
            --info: #60A5FA;
            --info-subtle: #1E3A5F;
            --bg: #0B1120;
            --bg-dim: #111827;
            --bg-panel: #1F2937;
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
            --text-muted: #64748B;
            --border: #374151;
            --border-focus: #22D3EE;
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg-dim);color:var(--text);line-height:1.6;min-height:100vh;font-size:14px}
        .navbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between}
        .navbar-brand{display:flex;align-items:center;gap:0.625rem;font-size:1.05rem;font-weight:700;color:var(--text);text-decoration:none}
        .navbar-brand .logo{width:28px;height:28px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
        .navbar-actions{display:flex;align-items:center;gap:0.5rem}
        .nav-btn{width:36px;height:36px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s}
        .nav-btn:hover{background:var(--bg-dim);color:var(--text);border-color:var(--accent)}
        .container{max-width:1400px;margin:0 auto;padding:1.5rem 2rem}
        .main-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
        @media(max-width:1024px){.main-grid{grid-template-columns:1fr}}
        .panel{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius)}
        .panel-header{padding:0.875rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:0.75rem}
        .panel-header h2{font-size:0.9rem;font-weight:600;display:flex;align-items:center;gap:0.5rem;color:var(--text)}
        .panel-header h2 .h-icon{color:var(--accent);font-size:1rem;width:18px;text-align:center}
        .panel-body{padding:1.25rem}
        .full-width{grid-column:1/-1}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        @media(max-width:640px){.form-row{grid-template-columns:1fr}}
        .form-group{margin-bottom:1rem}
        .form-group:last-child{margin-bottom:0}
        .form-label{display:block;font-size:0.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:0.375rem;text-transform:uppercase;letter-spacing:.04em}
        input,textarea,select{width:100%;padding:0.5rem 0.75rem;font-size:0.875rem;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;transition:border-color .15s,box-shadow .15s}
        input:focus,textarea:focus,select:focus{outline:none;border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(8,145,178,0.1)}
        textarea{resize:vertical;min-height:60px}
        ::placeholder{color:var(--text-muted)}
        .btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.5rem 0.875rem;font-size:0.8rem;font-weight:600;border-radius:var(--radius);border:1px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
        .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
        .btn-primary:hover{background:var(--accent-hover)}
        .btn-secondary{background:var(--bg);color:var(--text);border-color:var(--border)}
        .btn-secondary:hover{background:var(--bg-dim);border-color:var(--accent)}
        .btn-success{background:var(--success);color:#fff}
        .btn-success:hover{opacity:.9}
        .btn-danger{background:var(--danger);color:#fff}
        .btn-danger:hover{opacity:.9}
        .btn-lg{padding:0.625rem 1.25rem;font-size:0.875rem}
        .btn-block{width:100%;justify-content:center}
        .btn-group{display:flex;gap:0.5rem;flex-wrap:wrap}
        .tag{display:inline-flex;align-items:center;gap:0.25rem;padding:0.125rem 0.5rem;font-size:0.7rem;font-weight:600;border-radius:3px;text-transform:uppercase;letter-spacing:.04em}
        .tag-info{background:var(--info-subtle);color:var(--info)}
        .tag-success{background:var(--success-subtle);color:var(--success)}
        .file-tree{font-family:"JetBrains Mono","Fira Code","Cascadia Code","Consolas",monospace;font-size:13px;line-height:1.8;max-height:420px;overflow-y:auto}
        .file-tree ul{list-style:none;padding-left:0}
        .tree-dir,.tree-file{display:flex;align-items:center;gap:0.4rem;padding:0.15rem 0.375rem;border-radius:3px;cursor:pointer;transition:background .1s}
        .tree-dir{color:var(--accent);font-weight:500}
        .tree-file{color:var(--text-secondary)}
        .tree-dir:hover,.tree-file:hover{background:var(--bg-dim)}
        .tree-dir i,.tree-file i{font-size:12px;width:14px;text-align:center;opacity:.7}
        .code-viewer{background:var(--bg-dim);border:1px solid var(--border);border-radius:var(--radius);max-height:420px;overflow-y:auto}
        .code-viewer .annotation{padding:0.625rem 1rem;font-size:0.8rem;color:var(--accent);border-bottom:1px solid var(--border);background:var(--accent-subtle)}
        .code-viewer pre{padding:0.875rem 1rem;margin:0;font-family:"JetBrains Mono","Fira Code","Cascadia Code","Consolas",monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:var(--text)}
        .readme-output{width:100%;min-height:240px;font-family:"JetBrains Mono","Fira Code","Cascadia Code","Consolas",monospace;font-size:13px;line-height:1.5;resize:vertical}
        .chat-area{border:1px solid var(--border);border-radius:var(--radius);display:flex;flex-direction:column;background:var(--bg)}
        .chat-messages{flex:1;overflow-y:auto;padding:0.75rem;background:var(--bg-dim);max-height:280px;min-height:180px}
        .chat-msg{margin-bottom:0.625rem;max-width:88%;font-size:0.8125rem;line-height:1.5}
        .chat-msg.user{margin-left:auto}
        .chat-msg.user .msg-bubble{background:var(--accent);color:#fff;border-radius:10px 10px 2px 10px;padding:0.5rem 0.75rem}
        .chat-msg.assistant .msg-bubble{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:10px 10px 10px 2px;padding:0.5rem 0.75rem}
        .chat-input-row{display:flex;gap:0.5rem;padding:0.625rem 0.75rem;border-top:1px solid var(--border)}
        .chat-input-row input{flex:1;border:none;background:transparent;padding:0.375rem 0;font-size:0.8125rem}
        .chat-input-row input:focus{box-shadow:none}
        .chat-input-row button{padding:0.375rem 0.75rem;flex-shrink:0}
        .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(3px)}
        .overlay.show{display:flex}
        .modal{background:var(--bg);padding:2rem;border-radius:8px;min-width:380px;max-width:90vw;text-align:center;box-shadow:var(--shadow-md);border:1px solid var(--border)}
        .modal h3{font-size:1rem;font-weight:600;margin-bottom:1rem;color:var(--text)}
        .progress-bar{height:6px;background:var(--bg-panel);border-radius:3px;margin:1rem 0;overflow:hidden}
        .progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;width:0%}
        .progress-text{font-size:0.8rem;color:var(--text-secondary)}
        .spinner{width:36px;height:36px;border:3px solid var(--bg-panel);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0.75rem auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .empty-state{text-align:center;padding:2rem;color:var(--text-muted)}
        .empty-state .empty-icon{font-size:2rem;margin-bottom:0.5rem;opacity:.5}
        @media(max-width:768px){.navbar{padding:0 1rem}.container{padding:1rem}.main-grid{gap:1rem}.modal{min-width:auto;margin:0 1rem}}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
    </style>
</head>

    <script>
        const IGNORE_DIRS = new Set([
            '__pycache__', '.git', '.venv', 'venv', 'env', 'node_modules',
            '.cache', '.idea', '.vscode', 'dist', 'build', 'target',
            '.pytest_cache', '.mypy_cache', '.ruff_cache',
            'transformers', 'models', 'pretrained_models', 'bert', 'qwen',
            'llama', 'gpt', 't5', 'vit', 'resnet', 'checkpoints', 'weights'
        ]);
        const IGNORE_FILE_EXTS = new Set([
            '.bin', '.pth', '.pt', '.safetensors', '.h5', '.pb', '.onnx',
            '.ckpt', '.pkl', '.joblib', '.npy', '.npz', '.model', '.weights',
            '.pickle', '.parquet', '.arrow', '.msgpack'
        ]);
        const TEXT_EXTS = new Set([
            '.py', '.js', '.ts', '.json', '.md', '.txt', '.yml', '.yaml', '.toml',
            '.ini', '.cfg', '.html', '.css', '.scss', '.sql', '.sh', '.java', '.c', '.cpp'
        ]);
        const MAX_FILE_SIZE_MB = 1;
        function shouldIgnoreFile(fileName, fileSize, relativePath) {
            const pathParts = relativePath.split('/');
            for (let part of pathParts.slice(0, -1)) { if (IGNORE_DIRS.has(part)) return true; }
            const ext = fileName.substring(fileName.lastIndexOf('.')).toLowerCase();
            if (IGNORE_FILE_EXTS.has(ext)) return true;
            if (fileSize > MAX_FILE_SIZE_MB * 1024 * 1024) return true;
            return false;
        }

        let currentSession = null;
        let currentSessionConfig = { model_name: '', api_base: '' };
        let fileTreeJson = null;

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const setTheme = (dark) => {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            themeToggle.innerHTML = dark ? '&#9789;' : '&#9788;';
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        };
        const isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        setTheme(isDark);
        themeToggle.addEventListener('click', () => {
            setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
        });

        function showProgress(title, mode) {
            const overlay = document.getElementById('progressOverlay');
            const progressBar = document.getElementById('progressBarFill');
            const msgDiv = document.getElementById('progressMessage');
            const titleDiv = document.getElementById('progressTitle');
            const indeterminateDiv = document.getElementById('indeterminateProgress');
            const uploadStats = document.getElementById('uploadStats');
            overlay.classList.add('show');
            titleDiv.innerText = title;
            msgDiv.innerText = '&#20934;&#22791;&#20013;...';
            uploadStats.innerText = '';
            if (mode === 'indeterminate') {
                indeterminateDiv.style.display = 'block';
                progressBar.style.display = 'none';
            } else {
                indeterminateDiv.style.display = 'none';
                progressBar.style.display = 'block';
                progressBar.style.width = '0%';
            }
        }
        function updateProgress(percent, message, stats) {
            const progressBar = document.getElementById('progressBarFill');
            const msgDiv = document.getElementById('progressMessage');
            const uploadStats = document.getElementById('uploadStats');
            if (progressBar && progressBar.style.display !== 'none') progressBar.style.width = percent + '%';
            msgDiv.innerText = message;
            if (stats) uploadStats.innerText = stats;
        }
        function hideProgress() {
            document.getElementById('progressOverlay').classList.remove('show');
            document.getElementById('progressBarFill').style.width = '0%';
        }

        async function watchGenerationTask(taskId) {
            return new Promise((resolve, reject) => {
                const eventSource = new EventSource('/api/task/' + taskId + '/stream');
                eventSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.progress !== undefined) updateProgress(data.progress, data.message);
                    if (data.status === 'completed') { eventSource.close(); hideProgress(); resolve(data.result); }
                    else if (data.status === 'failed') { eventSource.close(); hideProgress(); reject(new Error(data.error || data.message)); }
                };
                eventSource.onerror = () => { eventSource.close(); hideProgress(); reject(new Error('SSE&#36830;&#25509;&#22833;&#36133;')); };
            });
        }

        function uploadFormDataWithProgress(formData, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/generate-task', true);
                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) { const pct = Math.round((e.loaded / e.total) * 100); onProgress(pct, e.loaded, e.total); }
                });
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try { resolve(JSON.parse(xhr.responseText)); } catch (err) { reject(new Error(err.message)); }
                    } else { reject(new Error('&#19978;&#20256;&#22833;&#36133; (' + xhr.status + ')')); }
                };
                xhr.onerror = () => reject(new Error('&#32593;&#32476;&#38169;&#35823;'));
                xhr.send(formData);
            });
        }

        const form = document.getElementById('genForm');
        form.onsubmit = async (e) => {
            e.preventDefault();
            const repoUrl = document.querySelector('input[name="repo_url"]').value.trim();
            const userReqs = document.querySelector('textarea[name="user_requirements"]').value;
            const platform = document.querySelector('select[name="platform_target"]').value;
            let modelName = document.getElementById('modelNameSelect').value;
            if (modelName === 'custom') modelName = document.getElementById('customModelName').value.trim();
            else if (modelName === '') modelName = null;
            const apiBase = document.getElementById('apiBaseInput').value.trim() || null;
            const formData = new FormData();
            if (repoUrl) { formData.append('repo_url', repoUrl); }
            else {
                const uploadType = document.getElementById('uploadType').value;
                if (uploadType === 'folder') {
                    const files = document.getElementById('folderInput').files;
                    if (!files.length) { alert('&#35831;&#36873;&#25321;&#25991;&#20214;&#22841;&#25110;&#36755;&#20837;GitHub&#38142;&#25509;'); return; }
                    const ignoredFiles = []; let keptCount = 0;
                    for (let f of files) {
                        const relPath = f.webkitRelativePath;
                        if (shouldIgnoreFile(f.name, f.size, relPath)) { ignoredFiles.push(relPath); }
                        else { formData.append('folder_files', f, f.webkitRelativePath); keptCount++; }
                    }
                    formData.append('ignored_files', JSON.stringify(ignoredFiles));
                    if (keptCount === 0 && ignoredFiles.length > 0) { alert('&#25152;&#36873;&#25991;&#20214;&#22841;&#20013;&#30340;&#25152;&#26377;&#25991;&#20214;&#37117;&#34987;&#36807;&#28388;&#65292;&#35831;&#36873;&#25321;&#21547;&#28304;&#20195;&#30721;&#30340;&#25991;&#20214;&#22841;'); return; }
                } else {
                    const zipFile = document.getElementById('zipInput').files[0];
                    if (!zipFile) { alert('&#35831;&#36873;&#25321;ZIP&#25991;&#20214;'); return; }
                    formData.append('folder_zip', zipFile);
                }
            }
            formData.append('user_requirements', userReqs);
            formData.append('platform_target', platform);
            if (modelName) formData.append('model_name', modelName);
            if (apiBase) formData.append('api_base', apiBase);
            showProgress('&#27491;&#22312;&#19978;&#20256;&#39033;&#30446;&#25991;&#20214;', 'determinate');
            let taskId = null;
            try {
                const uploadResponse = await uploadFormDataWithProgress(formData, (percent, loaded, total) => {
                    const mbLoaded = (loaded / 1024 / 1024).toFixed(1);
                    const mbTotal = (total / 1024 / 1024).toFixed(1);
                    updateProgress(percent, '&#19978;&#20256;&#20013; ' + percent + '%', mbLoaded + ' MB / ' + mbTotal + ' MB');
                });
                taskId = uploadResponse.task_id;
                if (!taskId) throw new Error('&#26381;&#21153;&#22120;&#26410;&#36820;&#22238;&#20219;&#21153;ID');
                showProgress('&#27491;&#22312;&#29983;&#25104; README', 'determinate');
                updateProgress(0, '&#21518;&#21488;&#20998;&#26512;&#20013;&#65292;&#35831;&#31245;&#20505;...');
                const result = await watchGenerationTask(taskId);
                currentSession = result.session_id;
                currentSessionConfig = { model_name: modelName, api_base: apiBase };
                document.getElementById('readmeContent').value = result.readme_content;
                document.getElementById('readmeStatus').style.display = 'inline-flex';
                if (result.file_tree_json) { fileTreeJson = result.file_tree_json; renderFileTree(fileTreeJson); }
                else if (result.file_tree_preview) { document.getElementById('fileTree').innerText = result.file_tree_preview; }
            } catch (err) { hideProgress(); alert('&#25805;&#20316;&#22833;&#36133;: ' + err.message); }
        };

        function renderFileTree(node, container) {
            const root = container || document.getElementById('fileTree');
            if (!container) root.innerHTML = '';
            const ul = document.createElement('ul');
            ul.style.listStyle = 'none'; ul.style.paddingLeft = '0';
            function build(n, parentUl) {
                for (let [name, info] of Object.entries(n)) {
                    const li = document.createElement('li');
                    if (info.type === 'dir') {
                        const span = document.createElement('span');
                        span.innerHTML = '&#128193; ' + name;
                        span.className = 'tree-dir';
                        span.onclick = () => {
                            let childUl = li.querySelector('ul');
                            if (childUl) childUl.style.display = childUl.style.display === 'none' ? 'block' : 'none';
                            else { childUl = document.createElement('ul'); childUl.style.paddingLeft = '20px'; childUl.style.listStyle = 'none'; build(info.children, childUl); li.appendChild(childUl); }
                        };
                        li.appendChild(span);
                    } else {
                        const span = document.createElement('span');
                        span.innerHTML = '&#128196; ' + name;
                        span.className = 'tree-file';
                        span.onclick = () => loadFileContent(info.path);
                        li.appendChild(span);
                    }
                    parentUl.appendChild(li);
                }
            }
            build(node, ul);
            if (!container) root.appendChild(ul); else container.appendChild(ul);
        }

        async function loadFileContent(filePath) {
            if (!currentSession) return;
            const resp = await fetch('/api/file_content?session_id=' + currentSession + '&file_path=' + encodeURIComponent(filePath));
            const data = await resp.json();
            const annEl = document.getElementById('fileAnnotation');
            if (data.annotation) { annEl.style.display = 'block'; annEl.innerHTML = '&#9432; ' + data.annotation; }
            else { annEl.style.display = 'none'; }
            document.getElementById('fileContent').innerText = data.content || '&#26080;&#20869;&#23481;';
        }

        function addMessage(text, role) {
            const chatMessages = document.getElementById('chatMessages');
            const emptyEl = chatMessages.querySelector('.empty-state');
            if (emptyEl) emptyEl.remove();
            const div = document.createElement('div');
            div.className = 'chat-msg ' + role;
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = text;
            div.appendChild(bubble);
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendChatWithLoading(sessionId, question) {
            showProgress('AI &#24605;&#32771;&#20013;', 'indeterminate');
            try {
                const resp = await fetch('/api/chat?session_id=' + sessionId + '&question=' + encodeURIComponent(question), { method: 'POST' });
                const data = await resp.json();
                hideProgress();
                return data.answer;
            } catch (err) { hideProgress(); throw err; }
        }

        async function genUnderstandingWithLoading(sessionId) {
            showProgress('&#29983;&#25104;&#39033;&#30446;&#29702;&#35299;&#25991;&#26723;', 'indeterminate');
            try {
                const resp = await fetch('/api/understanding?session_id=' + sessionId, { method: 'POST' });
                const data = await resp.json();
                hideProgress();
                return data.content;
            } catch (err) { hideProgress(); throw err; }
        }

        async function modifyWithProgress(sessionId, modification, platform, modelName, apiBase) {
            const submitResp = await fetch('/api/modify-task', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, modification: modification, platform_target: platform, model_name: modelName, api_base: apiBase })
            });
            const { task_id } = await submitResp.json();
            showProgress('&#27491;&#22312;&#20462;&#25913; README', 'determinate');
            updateProgress(0, '&#25552;&#20132;&#20462;&#25913;&#25351;&#20196;&#25104;&#21151;&#65292;&#31561;&#24453;&#29983;&#25104;...');
            return await watchGenerationTask(task_id);
        }

        // UI event bindings
        const uploadType = document.getElementById('uploadType');
        const folderDiv = document.getElementById('folderUploadDiv');
        const zipDiv = document.getElementById('zipUploadDiv');
        uploadType.onchange = () => {
            if (uploadType.value === 'folder') { folderDiv.style.display = 'block'; zipDiv.style.display = 'none'; }
            else { folderDiv.style.display = 'none'; zipDiv.style.display = 'block'; }
        };
        const modelSelect = document.getElementById('modelNameSelect');
        const customModel = document.getElementById('customModelName');
        modelSelect.onchange = () => { customModel.style.display = modelSelect.value === 'custom' ? 'block' : 'none'; };

        document.getElementById('modifyBtn').onclick = async () => {
            if (!currentSession) { alert('&#35831;&#20808;&#29983;&#25104; README'); return; }
            const modification = document.getElementById('modifyInput').value;
            if (!modification) return;
            const platform = document.querySelector('select[name="platform_target"]').value;
            try {
                const result = await modifyWithProgress(currentSession, modification, platform, currentSessionConfig.model_name, currentSessionConfig.api_base);
                document.getElementById('readmeContent').value = result.readme_content;
            } catch (err) { alert('&#20462;&#25913;&#22833;&#36133;&#65306;' + err.message); }
        };

        document.getElementById('copyBtn').onclick = () => {
            const readmeContent = document.getElementById('readmeContent').value;
            if (!readmeContent) { alert('&#27809;&#26377;&#21487;&#22797;&#21046;&#30340;&#20869;&#23481;'); return; }
            navigator.clipboard.writeText(readmeContent).then(() => {
                const btn = document.getElementById('copyBtn');
                const orig = btn.textContent;
                btn.textContent = '&#24050;&#22797;&#21046;';
                setTimeout(() => { btn.textContent = orig; }, 2000);
            }).catch(err => { alert('&#22797;&#21046;&#22833;&#36133;&#65306;' + err.message); });
        };

        document.getElementById('downloadBtn').onclick = () => {
            const readmeContent = document.getElementById('readmeContent').value;
            if (!readmeContent) { alert('&#27809;&#26377;&#21487;&#19979;&#36733;&#30340;&#20869;&#23481;'); return; }
            const blob = new Blob([readmeContent], {type: 'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'README.md'; a.click();
            URL.revokeObjectURL(url);
        };

        const sendBtn = document.getElementById('sendChatBtn');
        const chatInput = document.getElementById('chatInput');
        async function sendMessage() {
            const q = chatInput.value.trim();
            if (!q || !currentSession) return;
            addMessage(q, 'user');
            chatInput.value = '';
            try {
                const answer = await sendChatWithLoading(currentSession, q);
                addMessage(answer, 'assistant');
            } catch (err) { addMessage('&#20986;&#38169;&#65306;' + err.message, 'assistant'); }
        }
        sendBtn.onclick = sendMessage;
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        document.getElementById('clearChatBtn').onclick = () => {
            const el = document.getElementById('chatMessages');
            el.innerHTML = '<div class="empty-state" style="padding:1.5rem"><div class="empty-icon">&#128488;</div>&#29983;&#25104; README &#21518;&#21487;&#21521; AI &#25552;&#38382;</div>';
        };

        document.getElementById('genUnderstandingBtn').onclick = async () => {
            if (!currentSession) { alert('&#35831;&#20808;&#29983;&#25104; README'); return; }
            try {
                const content = await genUnderstandingWithLoading(currentSession);
                const blob = new Blob([content], {type: 'text/markdown'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'UNDERSTANDING.md'; a.click();
                URL.revokeObjectURL(url);
            } catch (err) { alert('&#29983;&#25104;&#22833;&#36133;&#65306;' + err.message); }
        };

        // Github URL sync
        const repoUrlInput = document.querySelector('input[name="repo_url"]');
        const githubUrlOverride = document.getElementById('githubUrlOverride');
        repoUrlInput.addEventListener('input', () => {
            const url = repoUrlInput.value.trim();
            if (url && url.includes('github.com')) githubUrlOverride.value = url;
        });

        document.getElementById('genHtmlBtn').onclick = async () => {
            if (!currentSession) { alert('&#35831;&#20808;&#29983;&#25104; README &#20197;&#24314;&#31435;&#39033;&#30446;&#20250;&#35805;'); return; }
            const customGithubUrl = githubUrlOverride.value.trim();
            const formData = new FormData();
            formData.append('session_id', currentSession);
            if (customGithubUrl) formData.append('github_url', customGithubUrl);
            showProgress('&#27491;&#22312;&#29983;&#25104;project_page', 'indeterminate');
            try {
                const response = await fetch('/api/generate_html_page', { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || '&#29983;&#25104;&#22833;&#36133;');
                hideProgress();
                const blob = new Blob([data.html_content], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = 'project_page.html'; a.click();
                URL.revokeObjectURL(url);
                alert('HTML &#25991;&#20214;&#24050;&#29983;&#25104;&#24182;&#24320;&#22987;&#19979;&#36733;');
            } catch (err) { hideProgress(); alert('&#29983;&#25104;&#22833;&#36133;: ' + err.message); }
        };
    </script>
</body>
</html>
